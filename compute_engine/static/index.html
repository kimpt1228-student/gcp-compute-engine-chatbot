<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Flash Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Markdown & Code Highlighting Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation Bar -->
    <header class="top-nav">
      <div class="nav-left">
        <button id="new-chat-btn" class="icon-btn tooltip" data-tooltip="새 대화 시작">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span class="nav-brand">Gemini</span>
        </button>
      </div>

      <div class="nav-center">
        <div class="current-model-tag" id="current-model-tag">
          <span class="sparkle-icon">✦</span>
          <span id="nav-model-name">Gemini 3.8 Flash</span>
        </div>
      </div>

      <div class="nav-right">
        <div id="api-status-badge" class="status-badge ready">
          <span class="status-dot"></span>
          <span id="status-text">API 준비 완료</span>
        </div>
        <button id="rename-user-btn" class="icon-btn tooltip" data-tooltip="사용자 이름 변경">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content">
      
      <!-- Welcome Hero Section (Matches Attached Image) -->
      <section class="welcome-section" id="welcome-section">
        <div class="hero-glow"></div>
        <div class="greeting-wrapper">
          <h1 class="greeting-text">
            <span id="user-display-name" class="editable-name" title="클릭하여 이름 수정">사용자</span>님, 무엇을 하고 싶으신가요?
          </h1>
        </div>

        <!-- Quick suggestion chips -->
        <div class="suggestion-chips" id="suggestion-chips">
          <button class="chip" data-prompt="오늘의 주요 IT 테크 트렌드와 AI 최신 동향을 요약해줘">
            <span class="chip-icon">💡</span> 최신 AI 트렌드 요약
          </button>
          <button class="chip" data-prompt="FastAPI와 Python을 활용한 고성능 비동기 웹 서비스 구현 팁을 알려줘">
            <span class="chip-icon">⚡</span> FastAPI 비동기 아키텍처
          </button>
          <button class="chip" data-prompt="Gemini 3.8 Flash와 3.7 Flash의 차이점과 강점을 비교 설명해줘">
            <span class="chip-icon">🔍</span> Gemini 3.8 vs 3.7 비교
          </button>
          <button class="chip" data-prompt="멋진 아이디어를 위한 브레인스토밍을 시작해보자">
            <span class="chip-icon">✨</span> 창의적 아이디어 기획
          </button>
        </div>
      </section>

      <!-- Chat Messages Container (Hidden initially until first message) -->
      <div class="chat-messages-container" id="chat-messages" style="display: none;">
        <!-- Dynamic message bubbles will appear here -->
      </div>
    </main>

    <!-- Sleek Capsule / Pill-shaped Search & Input Bar (Matches Attached Image) -->
    <footer class="input-container" id="input-container">
      <div class="pill-bar-wrapper">
        
        <!-- Attached File Preview Bar -->
        <div class="attachment-preview-bar" id="attachment-preview-bar" style="display: none;">
          <div class="attachment-card">
            <img id="attachment-img-preview" src="" alt="첨부 미리보기">
            <div class="attachment-info">
              <span id="attachment-filename">image.png</span>
              <span id="attachment-filesize">0 KB</span>
            </div>
            <button id="remove-attachment-btn" class="close-card-btn" title="첨부 취소">✕</button>
          </div>
        </div>

        <div class="pill-bar" id="pill-bar">
          
          <!-- Left: Plus (+) Button -->
          <button type="button" id="plus-btn" class="pill-icon-btn plus-btn tooltip" data-tooltip="이미지 또는 파일 첨부">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif" style="display: none;">

          <!-- Center: Chat Input Textarea -->
          <div class="pill-input-wrapper">
            <textarea 
              id="chat-input" 
              rows="1" 
              placeholder="Gemini에게 물어보기" 
              autocomplete="off"
              spellcheck="false"
            ></textarea>
          </div>

          <!-- Right: Controls (Model Selector + Mic + Send) -->
          <div class="pill-actions">
            
            <!-- Model Dropdown Trigger (Flash ∨) -->
            <div class="model-dropdown-wrapper" id="model-dropdown-wrapper">
              <button type="button" id="model-select-btn" class="model-select-btn" aria-haspopup="true" aria-expanded="false">
                <span id="selected-model-label">Flash</span>
                <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>

              <!-- Model Dropdown Menu -->
              <div class="model-dropdown-menu" id="model-dropdown-menu">
                <div class="menu-header">AI 모델 선택</div>
                
                <div class="model-option active" data-model="gemini-3.8-flash">
                  <div class="model-option-info">
                    <div class="model-option-name">
                      Gemini 3.8 Flash
                      <span class="badge badge-primary">기본 모델</span>
                    </div>
                    <div class="model-option-desc">최신 차세대 초고속 Flash 모델</div>
                  </div>
                  <div class="check-icon">✓</div>
                </div>

                <div class="model-option" data-model="gemini-3.7-flash">
                  <div class="model-option-info">
                    <div class="model-option-name">
                      Gemini 3.7 Flash
                      <span class="badge badge-secondary">3.7 Flash</span>
                    </div>
                    <div class="model-option-desc">안정적이고 강력한 Flash 모델</div>
                  </div>
                  <div class="check-icon">✓</div>
                </div>
              </div>
            </div>

            <!-- Web Search Toggle Button (Internet) -->
            <button type="button" id="web-search-btn" class="pill-icon-btn web-search-btn active tooltip" data-tooltip="웹 검색 연결됨 (Google Search Grounding)">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </button>

            <!-- Microphone Button (STT) -->
            <button type="button" id="mic-btn" class="pill-icon-btn mic-btn tooltip" data-tooltip="음성으로 질문하기">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
              </svg>
            </button>

            <!-- Send Button -->
            <button type="button" id="send-btn" class="pill-icon-btn send-btn tooltip" data-tooltip="전송 (Enter)" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>

          </div>
        </div>

        <div class="bottom-disclaimer">
          Gemini는 실수를 할 수 있습니다. 중요한 정보는 확인해 주세요.
        </div>
      </div>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
